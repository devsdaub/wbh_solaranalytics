name: Build & Push Image

# Baut bei jedem Push auf main das Image und legt es in der GitHub Container Registry ab.
# Das NAS baut nichts selbst, es zieht nur ghcr.io/devsdaub/wbh-solaranalytics (deploy/nas/).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'deploy/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Dieselben Tests wie lokal, gegen eine leere Postgres-Datenbank
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solaranalytics
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: solar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solar -d solaranalytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://solar:solar@localhost:5432/solaranalytics
      CONFIG_DIR: ${{ github.workspace }}/config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Datenbank anlegen wie beim Start der App
        run: python -c "import app.models; from app.database import Base, engine; from app.migration import ergaenze_spalten; from app.stammdaten import seed_plant_config; Base.metadata.create_all(engine); ergaenze_spalten(); seed_plant_config()"

      - name: Tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Owner lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/wbh-solaranalytics
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # das UGREEN-NAS hat einen Intel N100, also nur amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          echo "### Image gepusht" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solaranalytics
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solaranalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8009:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./config:/app/config
      - ./uploads:/app/uploads
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+psycopg2://solar:${DB_PASSWORD}@db:5432/solaranalytics
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: